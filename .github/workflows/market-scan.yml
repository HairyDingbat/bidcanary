name: Market scan (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan"
        default: "180"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/market_scan.py "${{ inputs.days }}"
      - uses: actions/upload-artifact@v4
        with:
          name: market-scan
          path: scan.json
