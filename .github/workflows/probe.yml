name: Probe (manual)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in scripts/ to run"
        default: "probe_cf.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python "scripts/${{ inputs.script }}"
